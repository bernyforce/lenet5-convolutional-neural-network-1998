<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#f8fafc" rx="12"/>
  <!-- Entrées -->
  <text x="30" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Entrée 1 (Pixel)</text>
  <circle cx="160" cy="70" r="18" fill="#e2e8f0" stroke="#0969da" stroke-width="2"/>
  <text x="160" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0969da">x₁</text>
  
  <text x="30" y="155" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Entrée 2 (Pixel)</text>
  <circle cx="160" cy="150" r="18" fill="#e2e8f0" stroke="#0969da" stroke-width="2"/>
  <text x="160" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0969da">x₂</text>

  <text x="30" y="235" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Entrée 3 (Pixel)</text>
  <circle cx="160" cy="230" r="18" fill="#e2e8f0" stroke="#0969da" stroke-width="2"/>
  <text x="160" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0969da">x₃</text>

  <!-- Flèches pondérées -->
  <line x1="180" y1="70" x2="280" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Poids w₁</text>

  <line x1="180" y1="150" x2="280" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Poids w₂</text>

  <line x1="180" y1="230" x2="280" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Poids w₃</text>

  <!-- Corps du Neurone (Somme + Seuil) -->
  <rect x="290" y="90" width="140" height="120" rx="16" fill="#eff6ff" stroke="#0969da" stroke-width="2"/>
  <circle cx="335" cy="150" r="26" fill="#dbeafe" stroke="#0969da" stroke-width="1.5"/>
  <text x="335" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#0969da">∑</text>
  <text x="335" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">1. Somme</text>

  <line x1="365" y1="110" x2="365" y2="190" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <path d="M 385 165 L 400 165 L 400 135 L 415 135" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="400" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">2. Seuil</text>

  <!-- Sortie -->
  <line x1="430" y1="150" x2="500" y2="150" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <circle cx="530" cy="150" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d">OUI / 1</text>
  <text x="530" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Sortie activée</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>
</svg>