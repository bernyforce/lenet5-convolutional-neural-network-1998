<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#f8fafc" rx="12"/>

  <!-- Image source 5x5 -->
  <g transform="translate(40, 45)">
    <text x="90" y="-12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Image d'entrée (5x5)</text>
    
    <!-- Grille de base -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1">
      <rect x="0" y="0" width="36" height="36"/><rect x="36" y="0" width="36" height="36"/><rect x="72" y="0" width="36" height="36"/><rect x="108" y="0" width="36" height="36"/><rect x="144" y="0" width="36" height="36"/>
      <rect x="0" y="36" width="36" height="36"/><rect x="36" y="36" width="36" height="36"/><rect x="72" y="36" width="36" height="36"/><rect x="108" y="36" width="36" height="36"/><rect x="144" y="36" width="36" height="36"/>
      <rect x="0" y="72" width="36" height="36"/><rect x="36" y="72" width="36" height="36"/><rect x="72" y="72" width="36" height="36"/><rect x="108" y="72" width="36" height="36"/><rect x="144" y="72" width="36" height="36"/>
      <rect x="0" y="108" width="36" height="36"/><rect x="36" y="108" width="36" height="36"/><rect x="72" y="108" width="36" height="36"/><rect x="108" y="108" width="36" height="36"/><rect x="144" y="108" width="36" height="36"/>
      <rect x="0" y="144" width="36" height="36"/><rect x="36" y="144" width="36" height="36"/><rect x="72" y="144" width="36" height="36"/><rect x="108" y="144" width="36" height="36"/><rect x="144" y="144" width="36" height="36"/>
    </g>

    <!-- Filtre 3x3 sur la position actuelle -->
    <rect x="0" y="0" width="108" height="108" fill="#dbeafe" fill-opacity="0.6" stroke="#2563eb" stroke-width="3" rx="4"/>
    <text x="54" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">Filtre 3×3</text>
  </g>

  <!-- Flèche opération -->
  <g transform="translate(250, 125)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue2)"/>
    <text x="30" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Calcul local</text>
  </g>

  <!-- Carte de caractéristiques (Feature Map 3x3) -->
  <g transform="translate(345, 75)">
    <text x="65" y="-15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Carte de traits (3x3)</text>
    
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="0" y="0" width="42" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="21" y="26" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">R₁</text>
      
      <rect x="42" y="0" width="42" height="42"/>
      <rect x="84" y="0" width="42" height="42"/>
      <rect x="0" y="42" width="42" height="42"/>
      <rect x="42" y="42" width="42" height="42"/>
      <rect x="84" y="42" width="42" height="42"/>
      <rect x="0" y="84" width="42" height="42"/>
      <rect x="42" y="84" width="42" height="42"/>
      <rect x="84" y="84" width="42" height="42"/>
    </g>
  </g>

  <text x="300" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Le filtre glisse pixel par pixel et détecte les motifs locaux (barres, angles, boucles)</text>

  <defs>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
</svg>