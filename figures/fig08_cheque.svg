<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="100%" height="100%">
  <rect width="650" height="300" fill="#f8fafc" rx="12"/>

  <!-- Chèque bancaire -->
  <g transform="translate(30, 60)">
    <rect width="200" height="120" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
    <!-- Bandes décoratives chèque -->
    <rect x="10" y="12" width="60" height="12" fill="#e2e8f0" rx="2"/>
    <text x="15" y="21" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">BANQUE NATIONALE</text>
    
    <line x1="15" y1="50" x2="130" y2="50" stroke="#cbd5e1"/>
    <line x1="15" y1="75" x2="130" y2="75" stroke="#cbd5e1"/>

    <!-- Case Montant entourée -->
    <rect x="140" y="40" width="48" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="4"/>
    <text x="164" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#b45309">7 $</text>
    <text x="164" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706">Zone lue</text>
  </g>

  <!-- Flèche vers scanner -->
  <g transform="translate(245, 120)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue3)"/>
  </g>

  <!-- Machine de tri NCR avec LeNet-5 -->
  <g transform="translate(305, 50)">
    <rect width="160" height="140" fill="#1e293b" stroke="#0f172a" stroke-width="2" rx="10"/>
    <rect x="15" y="15" width="130" height="40" fill="#0284c7" rx="4"/>
    <text x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Machine NCR</text>
    
    <rect x="25" y="70" width="110" height="50" fill="#0f172a" rx="4"/>
    <text x="80" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Puce DSP + LeNet-5</text>
    <text x="80" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Millions chèques/jour</text>
  </g>

  <!-- Flèche vers sortie -->
  <g transform="translate(480, 120)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green3)"/>
  </g>

  <!-- Sortie Reconnaissance -->
  <g transform="translate(540, 75)">
    <circle cx="45" cy="45" r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="45" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#15803d">7</text>
    <text x="45" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Chiffre validé</text>
  </g>

  <text x="325" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Application commerciale réelle (1998) : reconnaissance automatique de ~10% des chèques aux USA</text>

  <defs>
    <marker id="arrow-blue3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0969da" />
    </marker>
    <marker id="arrow-green3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>
</svg>