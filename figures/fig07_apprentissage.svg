<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#f8fafc" rx="12"/>

  <text x="300" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L'Apprentissage : Diminution de l'Erreur au fil des Tours (Époques)</text>

  <!-- Début -->
  <g transform="translate(60, 70)">
    <text x="60" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Tour 1 (Début)</text>
    <rect x="35" y="20" width="50" height="150" fill="#fee2e2" stroke="#dc2626" rx="6"/>
    <rect x="35" y="35" width="50" height="135" fill="#ef4444" rx="4"/>
    <text x="60" y="105" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">90 %</text>
    <text x="60" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">Forte erreur</text>
  </g>

  <!-- Flèche 1 -->
  <g transform="translate(180, 140)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="20" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Correction</text>
  </g>

  <!-- Milieu -->
  <g transform="translate(240, 70)">
    <text x="60" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d97706">Tour 10 (Milieu)</text>
    <rect x="35" y="20" width="50" height="150" fill="#fef3c7" stroke="#d97706" rx="6"/>
    <rect x="35" y="110" width="50" height="60" fill="#f59e0b" rx="4"/>
    <text x="60" y="145" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">25 %</text>
    <text x="60" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">En progrès</text>
  </g>

  <!-- Flèche 2 -->
  <g transform="translate(360, 140)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="20" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Ajustement</text>
  </g>

  <!-- Fin (LeNet-5) -->
  <g transform="translate(420, 70)">
    <text x="60" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">Tour 50 (Terminé)</text>
    <rect x="35" y="20" width="50" height="150" fill="#dcfce7" stroke="#16a34a" rx="6"/>
    <rect x="35" y="160" width="50" height="10" fill="#22c55e" rx="2"/>
    <text x="60" y="150" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">0.8 %</text>
    <text x="60" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Précision &gt; 99%</text>
  </g>

  <text x="300" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Rétropropagation : à chaque essai erroné, les 60 000 poids sont légèrement modifiés</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>
</svg>