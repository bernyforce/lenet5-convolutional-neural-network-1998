<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#f8fafc" rx="12"/>
  
  <text x="300" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Organisation en Couches : L'Immeuble à Étages</text>

  <!-- Étage 3 (Haut) : Sortie / Décision Finale -->
  <g transform="translate(80, 50)">
    <rect width="440" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#166534">Étage 3 : Couche de Sortie (Décision finale)</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">Émet la classe reconnue parmi les 10 chiffres (0 à 9)</text>
    
    <!-- Neurones de sortie -->
    <g transform="translate(300, 15)">
      <circle cx="20" cy="20" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">« 7 »</text>
      
      <circle cx="60" cy="20" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="60" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">autre</text>
      
      <circle cx="95" cy="20" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">autre</text>
    </g>
  </g>

  <!-- Flèches montantes Étage 2 vers Étage 3 -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="220" y1="145" x2="220" y2="125" marker-end="url(#arrow-up-green)"/>
    <line x1="300" y1="145" x2="300" y2="125" marker-end="url(#arrow-up-green)"/>
    <line x1="380" y1="145" x2="380" y2="125" marker-end="url(#arrow-up-green)"/>
  </g>

  <!-- Étage 2 (Milieu) : Couche Cachée -->
  <g transform="translate(80, 145)">
    <rect width="440" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Étage 2 : Couche Cachée (Combinaison des traits)</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">Assemble les points en segments (lignes obliques, barres)</text>
    
    <!-- Neurones cachés -->
    <g transform="translate(300, 18)">
      <circle cx="20" cy="20" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="20" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">h₁</text>
      
      <circle cx="60" cy="20" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="60" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">h₂</text>
      
      <circle cx="100" cy="20" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">h₃</text>
    </g>
  </g>

  <!-- Flèches montantes Étage 1 vers Étage 2 -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="220" y1="245" x2="220" y2="225" marker-end="url(#arrow-up-blue)"/>
    <line x1="300" y1="245" x2="300" y2="225" marker-end="url(#arrow-up-blue)"/>
    <line x1="380" y1="245" x2="380" y2="225" marker-end="url(#arrow-up-blue)"/>
  </g>

  <!-- Étage 1 (Bas) : Couche d'Entrée -->
  <g transform="translate(80, 245)">
    <rect width="440" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">Étage 1 : Couche d'Entrée (Pixels bruts)</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Reçoit les valeurs de luminosité de l'image (0 à 255)</text>
    
    <!-- Pixels d'entrée -->
    <g transform="translate(290, 15)">
      <circle cx="15" cy="20" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="15" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">x₁</text>
      
      <circle cx="45" cy="20" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="45" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">x₂</text>
      
      <circle cx="75" cy="20" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">x₃</text>
      
      <circle cx="105" cy="20" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="105" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">x₄</text>
    </g>
  </g>

  <text x="300" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">L'information monte d'étage en étage : des détails bruts vers la décision globale</text>

  <defs>
    <marker id="arrow-up-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-up-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#16a34a" />
    </marker>
  </defs>
</svg>