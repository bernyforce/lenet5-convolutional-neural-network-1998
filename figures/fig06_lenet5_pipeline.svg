<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="100%" height="100%">
  <rect width="750" height="320" fill="#f8fafc" rx="12"/>

  <!-- Titre -->
  <text x="375" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Architecture LeNet-5 (Yann LeCun et al., 1998)</text>

  <!-- Entrée 32x32 -->
  <g transform="translate(30, 70)">
    <rect width="45" height="150" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="4"/>
    <text x="22" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">Image</text>
    <text x="22" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">32×32</text>
  </g>

  <!-- C1: Convolution 6 plans 28x28 -->
  <g transform="translate(110, 70)">
    <rect width="55" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="27" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">C1</text>
    <text x="27" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">6 plans</text>
    <text x="27" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">28×28</text>
  </g>

  <!-- S2: Subsampling (Pooling) 6 plans 14x14 -->
  <g transform="translate(200, 85)">
    <rect width="50" height="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="4"/>
    <text x="25" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d">S2</text>
    <text x="25" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">Pooling</text>
    <text x="25" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">14×14</text>
  </g>

  <!-- C3: Convolution 16 plans 10x10 -->
  <g transform="translate(285, 75)">
    <rect width="60" height="140" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="30" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">C3</text>
    <text x="30" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">16 plans</text>
    <text x="30" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">10×10</text>
  </g>

  <!-- S4: Subsampling (Pooling) 16 plans 5x5 -->
  <g transform="translate(380, 95)">
    <rect width="50" height="100" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="4"/>
    <text x="25" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d">S4</text>
    <text x="25" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">Pooling</text>
    <text x="25" y="79" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">5×5</text>
  </g>

  <!-- C5: Conv pleine / Dense 120 -->
  <g transform="translate(465, 80)">
    <rect width="55" height="130" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="4"/>
    <text x="27" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#7e22ce">C5</text>
    <text x="27" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9333ea">120 u.</text>
    <text x="27" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Dense</text>
  </g>

  <!-- F6: Fully Connected 84 -->
  <g transform="translate(555, 90)">
    <rect width="55" height="110" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="4"/>
    <text x="27" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#7e22ce">F6</text>
    <text x="27" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9333ea">84 u.</text>
    <text x="27" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Dense</text>
  </g>

  <!-- Sortie: 10 classes (0-9) -->
  <g transform="translate(645, 80)">
    <rect width="70" height="130" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="4"/>
    <text x="35" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Sortie</text>
    <text x="35" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#d97706">« 7 »</text>
    <text x="35" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#78350f">10 classes</text>
  </g>

  <!-- Liens fléchés -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M 75 145 L 110 145"/>
    <path d="M 165 145 L 200 145"/>
    <path d="M 250 145 L 285 145"/>
    <path d="M 345 145 L 380 145"/>
    <path d="M 430 145 L 465 145"/>
    <path d="M 520 145 L 555 145"/>
    <path d="M 610 145 L 645 145"/>
  </g>

  <!-- Légende en bas -->
  <g transform="translate(100, 270)" font-family="system-ui, sans-serif" font-size="11">
    <rect x="0" y="0" width="16" height="16" fill="#eff6ff" stroke="#2563eb" rx="2"/><text x="24" y="13" fill="#1e293b">Convolution (filtre)</text>
    <rect x="170" y="0" width="16" height="16" fill="#f0fdf4" stroke="#16a34a" rx="2"/><text x="194" y="13" fill="#1e293b">Pooling (compression)</text>
    <rect x="360" y="0" width="16" height="16" fill="#faf5ff" stroke="#9333ea" rx="2"/><text x="384" y="13" fill="#1e293b">Dense (décision)</text>
  </g>
</svg>