<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#f8fafc" rx="12"/>

  <!-- Bloc 4 cases avant pooling -->
  <g transform="translate(100, 70)">
    <text x="70" y="-15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Zone 2×2 (4 pixels)</text>
    
    <rect x="0" y="0" width="70" height="70" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="35" y="42" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="16">12</text>

    <rect x="70" y="0" width="70" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="105" y="42" text-anchor="middle" fill="#15803d" font-family="monospace" font-size="20" font-weight="bold">88</text>

    <rect x="0" y="70" width="70" height="70" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="35" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="16">20</text>

    <rect x="70" y="70" width="70" height="70" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="16">45</text>
  </g>

  <!-- Flèche Max-Pooling -->
  <g transform="translate(290, 140)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green2)"/>
    <text x="30" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">Max-Pooling</text>
    <text x="30" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">(Garder le max)</text>
  </g>

  <!-- Résultat 1 case -->
  <g transform="translate(400, 105)">
    <text x="45" y="-20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">1 seule case</text>
    <rect x="0" y="0" width="90" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="3" rx="8"/>
    <text x="45" y="55" text-anchor="middle" fill="#15803d" font-family="monospace" font-size="28" font-weight="bold">88</text>
  </g>

  <text x="300" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Le pooling divise la taille par 2 en gardant uniquement l'information la plus forte</text>

  <defs>
    <marker id="arrow-green2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>
</svg>