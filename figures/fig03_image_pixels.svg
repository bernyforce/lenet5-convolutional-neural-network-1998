<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#f8fafc" rx="12"/>
  
  <!-- Image visuelle chiffre 7 -->
  <g transform="translate(60, 50)">
    <text x="75" y="-15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Image vue par un humain</text>
    <rect width="150" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="4"/>
    <path d="M 30 35 L 120 35 L 75 125" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flèche transformation -->
  <g transform="translate(245, 125)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="30" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0969da">Numérisation</text>
  </g>

  <!-- Grille vue par la machine -->
  <g transform="translate(340, 45)">
    <text x="100" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Grille vue par la machine (0 à 255)</text>
    
    <!-- Ligne 1 -->
    <rect x="0" y="0" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="20" y="25" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">250</text>
    <rect x="40" y="0" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="60" y="25" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">255</text>
    <rect x="80" y="0" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="100" y="25" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">255</text>
    <rect x="120" y="0" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="140" y="25" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">240</text>
    <rect x="160" y="0" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="180" y="25" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>

    <!-- Ligne 2 -->
    <rect x="0" y="40" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="65" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
    <rect x="40" y="40" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="65" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
    <rect x="80" y="40" width="40" height="40" fill="#334155" stroke="#ffffff"/>
    <text x="100" y="65" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">180</text>
    <rect x="120" y="40" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="140" y="65" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">255</text>
    <rect x="160" y="40" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="180" y="65" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>

    <!-- Ligne 3 -->
    <rect x="0" y="80" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="105" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
    <rect x="40" y="80" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="105" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
    <rect x="80" y="80" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="100" y="105" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">255</text>
    <rect x="120" y="80" width="40" height="40" fill="#64748b" stroke="#ffffff"/>
    <text x="140" y="105" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">90</text>
    <rect x="160" y="80" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="180" y="105" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>

    <!-- Ligne 4 -->
    <rect x="0" y="120" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="145" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
    <rect x="40" y="120" width="40" height="40" fill="#0f172a" stroke="#ffffff"/>
    <text x="60" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">240</text>
    <rect x="80" y="120" width="40" height="40" fill="#334155" stroke="#ffffff"/>
    <text x="100" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">170</text>
    <rect x="120" y="120" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="145" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
    <rect x="160" y="120" width="40" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="180" y="145" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">0</text>
  </g>

  <text x="300" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Chaque case est un pixel : 0 = blanc pur, 255 = noir pur (encre)</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0969da" />
    </marker>
  </defs>
</svg>